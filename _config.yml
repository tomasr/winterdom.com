# visit https://github.com/mojombo/jekyll/wiki/Configuration for more settings

exclude: ["README.md"] # files to exclude
highlighter: rouge
markdown: kramdown
#disqus: winterdom
title: Winterdom
images_base: https://static.winterdom.com/images
permalink: /:year/:month/:day/:title
excerpt_separator: "\r\n"
BASE_PATH: https://winterdom.com
url: https://winterdom.com

pagination:
  enabled: true
  per_page: 10 
  permalink: '/page:num'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  -
    scope:
      path: "" # empty string for all files
    values:
      title: Winterdom

description: by d&#230;mons be driven - a site by Tomas Restrepo
author:
  name: Tomas Restrepo
  email: tomas@winterdom.com
  github: tomasr
  twitter: tomasrestrepo
  description: by d&aelig;mons be driven - a site by Tomas Restrepo
  bio: Software developer located in Colombia.
  500px: tomasr
  linkedin: tomasr
  email_md5: d2cb495ec8c6975874403030a4865a33

rss_path: feed.xml
categories_path: categories.html
tags_path: tags.html

# set it as url of an image
# sidebar_background_image: https://www.dropbox.com/s/g9h23zrycedxtk5/sky.png?raw=1

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - rouge
