{{ define "main" }}
<div class="page-header">
  <h1>{{ .Title }}</h1>
</div>

<ul class="list-unstyled">
  {{ range .Pages.ByDate.Reverse }}
    <li style="line-height: 35px;"><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="text-muted">- {{ .Date.Format "January 02, 2006" }}</span></li>
  {{ end }}
</ul>

<div class="clearfix"></div>
{{ end }}
